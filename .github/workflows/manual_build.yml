name: Manual Build

# Manually rebuild or update any single component.
#
# component       what to build
# architecture    target arch (ignored for cedar-solve and db-*)
# python-version  wheel ABI tag (ignored for cedar-detect and cedar-solve)
# publish         upload result to the databases-latest release
# record-sha      update vendor/.shas/ so the main workflow skips a redundant rebuild
#
# Requires databases-latest release to exist (created by buildbinaries.yml).

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to build'
        required: true
        type: choice
        options:
          - cedar-detect
          - sycamore-main
          - sycamore-matched
          - cedar-solve
          - tetra3rs
          - olive-solve
          - db-npz
          - db-bin
          - db-all
      architecture:
        description: 'Target architecture (ignored for cedar-solve and db-*)'
        required: true
        type: choice
        default: aarch64
        options:
          - aarch64
          - armv7
          - x86_64
          - x86
          - all
      python-version:
        description: 'Python version (ignored for cedar-detect and cedar-solve)'
        required: true
        type: choice
        default: cp313
        options:
          - cp313
          - cp312
          - cp311
          - many
      publish:
        description: 'Upload built artifact to databases-latest release'
        type: boolean
        default: true
      record-sha:
        description: 'Update vendor/.shas/ with new source SHA'
        type: boolean
        default: true

permissions:
  contents: write

jobs:

  # ── Resolve architecture list into a JSON array for downstream matrices ──────
  setup:
    runs-on: ubuntu-latest
    outputs:
      archs: ${{ steps.params.outputs.archs }}
    steps:
      - id: params
        run: |
          case "${{ inputs.architecture }}" in
            all)    echo 'archs=["aarch64","armv7","x86_64","x86"]' >> "$GITHUB_OUTPUT" ;;
            aarch64) echo 'archs=["aarch64"]' >> "$GITHUB_OUTPUT" ;;
            armv7)  echo 'archs=["armv7"]'    >> "$GITHUB_OUTPUT" ;;
            x86_64) echo 'archs=["x86_64"]'   >> "$GITHUB_OUTPUT" ;;
            x86)    echo 'archs=["x86"]'       >> "$GITHUB_OUTPUT" ;;
          esac

  # ── cedar-detect binary ──────────────────────────────────────────────────────
  cedar-detect-build:
    needs: [setup]
    if: ${{ inputs.component == 'cedar-detect' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.archs) }}
        include:
          - arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
            cross_pkg:   gcc-aarch64-linux-gnu
            linker_var:  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
            linker_val:  aarch64-linux-gnu-gcc
            strip_cmd:   aarch64-linux-gnu-strip
            rustflags:   "-C target-cpu=cortex-a53 -C codegen-units=1"
          - arch: armv7
            rust_target: armv7-unknown-linux-gnueabihf
            cross_pkg:   gcc-arm-linux-gnueabihf
            linker_var:  CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER
            linker_val:  arm-linux-gnueabihf-gcc
            strip_cmd:   arm-linux-gnueabihf-strip
            rustflags:   "-C target-cpu=cortex-a7 -C codegen-units=1"
          - arch: x86_64
            rust_target: ""
            cross_pkg:   ""
            linker_var:  ""
            linker_val:  ""
            strip_cmd:   strip
            rustflags:   ""
          - arch: x86
            rust_target: i686-unknown-linux-gnu
            cross_pkg:   gcc-multilib
            linker_var:  CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER
            linker_val:  gcc
            strip_cmd:   strip
            rustflags:   ""
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout cedar-detect
        uses: actions/checkout@v4
        with:
          repository: mconsidine/cedar-detect
          ref: ${{ vars.CEDARDETECT_REF || 'main' }}
          path: cedar-detect

      - name: Install build dependencies
        run: |
          sudo apt-get update
          PKGS="protobuf-compiler"
          [[ -n "${{ matrix.cross_pkg }}" ]] && PKGS="$PKGS ${{ matrix.cross_pkg }}"
          sudo apt-get install -y $PKGS

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compile target
        if: ${{ matrix.rust_target != '' }}
        run: rustup target add ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cedar-detect/target
          key: cargo-cedar-detect-${{ matrix.arch }}-${{ hashFiles('cedar-detect/Cargo.lock') }}
          restore-keys: cargo-cedar-detect-${{ matrix.arch }}-

      - name: Build cedar-detect-server
        working-directory: cedar-detect
        run: |
          export RUSTFLAGS="${{ matrix.rustflags }}"
          export CARGO_PROFILE_RELEASE_LTO=fat
          export CARGO_PROFILE_RELEASE_PANIC=abort
          [[ -n "${{ matrix.linker_var }}" ]] && \
            export "${{ matrix.linker_var }}=${{ matrix.linker_val }}"
          TARGET_ARG=""
          [[ -n "${{ matrix.rust_target }}" ]] && TARGET_ARG="--target ${{ matrix.rust_target }}"
          cargo build --release $TARGET_ARG --bin cedar-detect-server

      - name: Strip and stage binary
        run: |
          if [[ -n "${{ matrix.rust_target }}" ]]; then
            BIN=cedar-detect/target/${{ matrix.rust_target }}/release/cedar-detect-server
          else
            BIN=cedar-detect/target/release/cedar-detect-server
          fi
          ${{ matrix.strip_cmd }} "$BIN"
          mkdir -p staged
          cp "$BIN" staged/cedar-detect-server-${{ matrix.arch }}
          ls -lh staged/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cedar-detect-server-${{ matrix.arch }}
          path: staged/cedar-detect-server-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error

      - name: Publish to release
        if: ${{ inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # aarch64 uses the canonical name; other arches get an arch suffix
          if [[ "${{ matrix.arch }}" == "aarch64" ]]; then
            cp staged/cedar-detect-server-aarch64 staged/cedar-detect-server
            gh release upload databases-latest staged/cedar-detect-server \
              --clobber --repo mconsidine/astro_databases
          else
            gh release upload databases-latest \
              staged/cedar-detect-server-${{ matrix.arch }} \
              --clobber --repo mconsidine/astro_databases
          fi

  # ── sycamore-extract (maturin / PyO3) ───────────────────────────────────────
  sycamore-build:
    needs: [setup]
    if: ${{ inputs.component == 'sycamore-main' || inputs.component == 'sycamore-matched' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.archs) }}
        include:
          - arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
            cross_pkg:   gcc-aarch64-linux-gnu
            linker_var:  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
            linker_val:  aarch64-linux-gnu-gcc
            rustflags:   "-C target-cpu=cortex-a53 -C codegen-units=1"
          - arch: armv7
            rust_target: armv7-unknown-linux-gnueabihf
            cross_pkg:   gcc-arm-linux-gnueabihf
            linker_var:  CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER
            linker_val:  arm-linux-gnueabihf-gcc
            rustflags:   "-C target-cpu=cortex-a7 -C codegen-units=1"
          - arch: x86_64
            rust_target: ""
            cross_pkg:   ""
            linker_var:  ""
            linker_val:  ""
            rustflags:   ""
          - arch: x86
            rust_target: i686-unknown-linux-gnu
            cross_pkg:   gcc-multilib
            linker_var:  CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER
            linker_val:  gcc
            rustflags:   ""
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout sycamore-extract
        uses: actions/checkout@v4
        with:
          repository: mconsidine/sycamore-extract
          ref: >-
            ${{ inputs.component == 'sycamore-matched'
                && 'matched-filter-only'
                || vars.SYCAMORE_REF
                || 'main' }}
          path: sycamore-extract

      - name: Install cross-compiler
        if: ${{ matrix.cross_pkg != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_pkg }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compile target
        if: ${{ matrix.rust_target != '' }}
        run: rustup target add ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sycamore-extract/target
          key: cargo-sycamore-${{ inputs.component }}-${{ matrix.arch }}-${{ hashFiles('sycamore-extract/Cargo.lock') }}
          restore-keys: cargo-sycamore-${{ inputs.component }}-${{ matrix.arch }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
            3.13

      - name: Install maturin
        run: pip install "maturin>=1.0,<2.0"

      - name: Build wheel(s)
        working-directory: sycamore-extract
        run: |
          export RUSTFLAGS="${{ matrix.rustflags }}"
          export CARGO_PROFILE_RELEASE_LTO=fat
          export CARGO_PROFILE_RELEASE_PANIC=abort
          [[ -n "${{ matrix.linker_var }}" ]] && \
            export "${{ matrix.linker_var }}=${{ matrix.linker_val }}"
          TARGET_ARG=""
          [[ -n "${{ matrix.rust_target }}" ]] && TARGET_ARG="--target ${{ matrix.rust_target }}"
          case "${{ inputs.python-version }}" in
            many)  INTERPS="-i python3.11 -i python3.12 -i python3.13" ;;
            cp311) INTERPS="-i python3.11" ;;
            cp312) INTERPS="-i python3.12" ;;
            cp313) INTERPS="-i python3.13" ;;
          esac
          maturin build --release --strip $TARGET_ARG $INTERPS --out dist

      - name: Verify wheels
        working-directory: sycamore-extract
        run: |
          ls -lh dist/
          [[ $(ls dist/star_detect-*.whl 2>/dev/null | wc -l) -ge 1 ]] \
            || { echo "::error::No star_detect wheels produced"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: star_detect-wheel-${{ inputs.component }}-${{ matrix.arch }}
          path: sycamore-extract/dist/star_detect-*.whl
          retention-days: 7
          if-no-files-found: error

      - name: Publish to release
        if: ${{ inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd sycamore-extract/dist
          for whl in star_detect-*.whl; do
            if [[ "${{ inputs.component }}" == "sycamore-matched" ]]; then
              # Prefix so matched and main wheels can coexist in the release
              cp "$whl" "matched-filter-${whl}"
              gh release upload databases-latest "matched-filter-${whl}" \
                --clobber --repo mconsidine/astro_databases
            else
              gh release upload databases-latest "$whl" \
                --clobber --repo mconsidine/astro_databases
            fi
          done

  # ── cedar-solve (pure Python, architecture-independent) ─────────────────────
  cedar-solve-build:
    needs: [setup]
    if: ${{ inputs.component == 'cedar-solve' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout cedar-solve
        uses: actions/checkout@v4
        with:
          repository: mconsidine/cedar-solve
          ref: ${{ vars.CEDARSOLVE_REF || 'master' }}
          path: cedar-solve

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: pip install --upgrade pip build twine toml

      - name: Build wheel
        working-directory: cedar-solve
        run: |
          python -m build --wheel
          twine check dist/*

      - name: Verify wheel
        working-directory: cedar-solve
        run: |
          ls -lh dist/
          WHL=$(ls dist/cedar_solve-*-py3-none-any.whl 2>/dev/null | head -1)
          [[ -n "$WHL" ]] || { echo "::error::No cedar_solve wheel produced"; exit 1; }
          echo "Built: $WHL"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cedar-solve-wheel
          path: cedar-solve/dist/cedar_solve-*-py3-none-any.whl
          retention-days: 7
          if-no-files-found: error

      - name: Publish to release
        if: ${{ inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload databases-latest \
            cedar-solve/dist/cedar_solve-*-py3-none-any.whl \
            --clobber --repo mconsidine/astro_databases

  # ── tetra3rs (cibuildwheel + setuptools-rust; QEMU for arm targets) ──────────
  tetra3rs-build:
    needs: [setup]
    if: ${{ inputs.component == 'tetra3rs' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.archs) }}
        include:
          - arch: aarch64
            cibw_arch:     aarch64
            manylinux_tag: manylinux_aarch64
            rustflags:     "-C target-cpu=cortex-a53 -C codegen-units=1"
            needs_qemu:    true
          - arch: armv7
            cibw_arch:     armv7l
            manylinux_tag: manylinux_armv7l
            rustflags:     "-C target-cpu=cortex-a7 -C codegen-units=1"
            needs_qemu:    true
          - arch: x86_64
            cibw_arch:     x86_64
            manylinux_tag: manylinux_x86_64
            rustflags:     ""
            needs_qemu:    false
          - arch: x86
            cibw_arch:     i686
            manylinux_tag: manylinux_i686
            rustflags:     ""
            needs_qemu:    false
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout tetra3rs
        uses: actions/checkout@v4
        with:
          repository: mconsidine/tetra3rs
          ref: ${{ vars.TETRA3RS_REF || 'main' }}

      - name: Set up QEMU
        if: ${{ matrix.needs_qemu }}
        uses: docker/setup-qemu-action@v3

      - name: Compute CIBW_BUILD pattern
        id: cibw
        run: |
          TAG="${{ matrix.manylinux_tag }}"
          case "${{ inputs.python-version }}" in
            many)  echo "build=cp311-${TAG} cp312-${TAG} cp313-${TAG}" >> "$GITHUB_OUTPUT" ;;
            cp311) echo "build=cp311-${TAG}" >> "$GITHUB_OUTPUT" ;;
            cp312) echo "build=cp312-${TAG}" >> "$GITHUB_OUTPUT" ;;
            cp313) echo "build=cp313-${TAG}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build wheels via cibuildwheel
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.cibw_arch }}
          CIBW_BUILD: ${{ steps.cibw.outputs.build }}
          CIBW_BEFORE_ALL_LINUX: >
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
            | sh -s -- -y --profile minimal
          CIBW_ENVIRONMENT: >-
            PATH="$HOME/.cargo/bin:$PATH"
            RUSTFLAGS="${{ matrix.rustflags }}"
            CARGO_PROFILE_RELEASE_PANIC="abort"
          CIBW_BEFORE_BUILD: pip install setuptools>=68 setuptools-rust>=1.10
        with:
          output-dir: dist

      - name: Verify wheels
        run: |
          ls -lh dist/
          [[ $(ls dist/*.whl 2>/dev/null | wc -l) -ge 1 ]] \
            || { echo "::error::No tetra3rs wheels produced"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetra3rs-wheels-${{ matrix.arch }}
          path: dist/*.whl
          retention-days: 7
          if-no-files-found: error

      - name: Publish to release
        if: ${{ inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for whl in dist/*.whl; do
            gh release upload databases-latest "$whl" \
              --clobber --repo mconsidine/astro_databases
          done

  # ── olive-solve / tetra3-py (maturin / PyO3) ────────────────────────────────
  olive-solve-build:
    needs: [setup]
    if: ${{ inputs.component == 'olive-solve' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.archs) }}
        include:
          - arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
            cross_pkg:   gcc-aarch64-linux-gnu
            linker_var:  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
            linker_val:  aarch64-linux-gnu-gcc
            rustflags:   "-C target-cpu=cortex-a53 -C codegen-units=1"
          - arch: armv7
            rust_target: armv7-unknown-linux-gnueabihf
            cross_pkg:   gcc-arm-linux-gnueabihf
            linker_var:  CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER
            linker_val:  arm-linux-gnueabihf-gcc
            rustflags:   "-C target-cpu=cortex-a7 -C codegen-units=1"
          - arch: x86_64
            rust_target: ""
            cross_pkg:   ""
            linker_var:  ""
            linker_val:  ""
            rustflags:   ""
          - arch: x86
            rust_target: i686-unknown-linux-gnu
            cross_pkg:   gcc-multilib
            linker_var:  CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER
            linker_val:  gcc
            rustflags:   ""
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout olive-solve
        uses: actions/checkout@v4
        with:
          repository: mconsidine/olive-solve
          ref: ${{ vars.OLIVE_SOLVE_REF || 'main' }}

      - name: Install cross-compiler
        if: ${{ matrix.cross_pkg != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_pkg }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compile target
        if: ${{ matrix.rust_target != '' }}
        run: rustup target add ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-olive-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-olive-${{ matrix.arch }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
            3.13

      - name: Install maturin
        run: pip install "maturin>=1.0,<2.0"

      - name: Build wheel(s)
        working-directory: tetra3-py
        run: |
          export RUSTFLAGS="${{ matrix.rustflags }}"
          export CARGO_PROFILE_RELEASE_LTO=fat
          export CARGO_PROFILE_RELEASE_PANIC=abort
          [[ -n "${{ matrix.linker_var }}" ]] && \
            export "${{ matrix.linker_var }}=${{ matrix.linker_val }}"
          TARGET_ARG=""
          [[ -n "${{ matrix.rust_target }}" ]] && TARGET_ARG="--target ${{ matrix.rust_target }}"
          case "${{ inputs.python-version }}" in
            many)  INTERPS="-i python3.11 -i python3.12 -i python3.13" ;;
            cp311) INTERPS="-i python3.11" ;;
            cp312) INTERPS="-i python3.12" ;;
            cp313) INTERPS="-i python3.13" ;;
          esac
          maturin build --release --strip $TARGET_ARG $INTERPS --out dist

      - name: Verify wheels
        run: |
          ls -lh tetra3-py/dist/
          [[ $(ls tetra3-py/dist/tetra3-*.whl 2>/dev/null | wc -l) -ge 1 ]] \
            || { echo "::error::No tetra3 wheels produced"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetra3-py-wheel-${{ matrix.arch }}
          path: tetra3-py/dist/tetra3-*.whl
          retention-days: 7
          if-no-files-found: error

      - name: Publish to release
        if: ${{ inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for whl in tetra3-py/dist/tetra3-*.whl; do
            gh release upload databases-latest "$whl" \
              --clobber --repo mconsidine/astro_databases
          done

  # ── Star databases (cedar_solve_13deg.npz and/or tetra3rs_13deg.bin) ─────────
  databases-build:
    needs: [setup]
    if: ${{ startsWith(inputs.component, 'db-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout astro_databases
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download cedar-solve wheel from release
        if: ${{ inputs.component != 'db-bin' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prereq-wheels
          # gh release download databases-latest \
          #   --repo mconsidine/astro_databases \
          #   --pattern "cedar_solve-*-py3-none-any.whl" \
          #   --dir prereq-wheels
          cp databases-latest/cedar_solve-*-py3-none-any.whl /prereq-wheels/*

      - name: Download tetra3rs x86_64 wheel from release
        if: ${{ inputs.component != 'db-npz' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prereq-wheels
          # gh release download databases-latest \
          #   --repo mconsidine/astro_databases \
          #   --pattern "tetra3rs-*x86_64*.whl" \
          #   --dir prereq-wheels
          cp databases-latest/tetra3rs-*x86_64*.whl /prereq-wheels/*

      - name: Install packages
        run: |
          pip install --upgrade pip numpy
          if ls prereq-wheels/cedar_solve-*-py3-none-any.whl 2>/dev/null | grep -q .; then
            pip install --no-deps prereq-wheels/cedar_solve-*-py3-none-any.whl
          fi
          if ls prereq-wheels/tetra3rs-*x86_64*.whl 2>/dev/null | grep -q .; then
            pip install prereq-wheels/tetra3rs-*x86_64*.whl gaia-catalog
          fi

      - name: Cache hip_main.dat
        id: cache-hip
        if: ${{ inputs.component != 'db-bin' }}
        uses: actions/cache@v4
        with:
          path: databases/hip_main.dat
          key: hip-main-dat-immutable-v1

      - name: Download hip_main.dat (cache miss)
        if: ${{ inputs.component != 'db-bin' && steps.cache-hip.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p databases
          # curl -fsSL --retry 3 --connect-timeout 30 \
          #  https://raw.githubusercontent.com/mconsidine/astro_databases/main/hip_main.dat.gz \
          #  | gunzip > databases/hip_main.dat
          ls -lh
          gunzip hip_main.dat.gz databases/hip_main.dat
          [[ -f databases/hip_main.dat ]] \
            || { echo "::error::hip_main.dat download failed"; exit 1; }
          ls -lh databases/hip_main.dat

      - name: Generate databases
        run: |
          mkdir -p databases
          SKIP_ARGS=""
          HIP_ARG=""
          case "${{ inputs.component }}" in
            db-npz)
              SKIP_ARGS="--skip-tetra3rs"
              HIP_ARG="--hip-catalog databases/hip_main.dat"
              ;;
            db-bin)
              SKIP_ARGS="--skip-cedar-solve"
              ;;
            db-all)
              HIP_ARG="--hip-catalog databases/hip_main.dat"
              ;;
          esac
          python scripts/generate_databases.py \
            --output-dir databases \
            $HIP_ARG \
            $SKIP_ARGS
          ls -lh databases/*.npz databases/*.bin 2>/dev/null || true

      - name: Upload databases artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-databases-manual
          path: |
            databases/cedar_solve_13deg.npz
            databases/tetra3rs_13deg.bin
          retention-days: 7
          if-no-files-found: warn

      - name: Publish to release
        if: ${{ inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=()
          [[ -f databases/cedar_solve_13deg.npz ]] && FILES+=(databases/cedar_solve_13deg.npz)
          [[ -f databases/tetra3rs_13deg.bin ]]    && FILES+=(databases/tetra3rs_13deg.bin)
          if [[ ${#FILES[@]} -gt 0 ]]; then
            gh release upload databases-latest "${FILES[@]}" \
              --clobber --repo mconsidine/astro_databases
          else
            echo "::warning::No database files to upload"
          fi

  # ── Record source SHA so main workflow skips redundant rebuilds ──────────────
  record-sha:
    needs:
      - cedar-detect-build
      - sycamore-build
      - cedar-solve-build
      - tetra3rs-build
      - olive-solve-build
      - databases-build
    if: ${{ !cancelled() && inputs.record-sha == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout astro_databases
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record SHA / hash for successfully-built component
        env:
          CEDARDETECT_REF: ${{ vars.CEDARDETECT_REF || 'main' }}
          SYCAMORE_REF:    ${{ vars.SYCAMORE_REF    || 'main' }}
          CEDARSOLVE_REF:  ${{ vars.CEDARSOLVE_REF  || 'master' }}
          TETRA3RS_REF:    ${{ vars.TETRA3RS_REF    || 'main' }}
          OLIVE_SOLVE_REF: ${{ vars.OLIVE_SOLVE_REF || 'main' }}
        run: |
          mkdir -p vendor/.shas
          sha_of() {
            git ls-remote "https://github.com/$1.git" \
              "refs/heads/$2" "refs/tags/$2" 2>/dev/null \
            | head -1 | cut -f1
          }

          if [[ "${{ needs.cedar-detect-build.result }}" == "success" ]]; then
            sha_of mconsidine/cedar-detect "$CEDARDETECT_REF" > vendor/.shas/cedar-detect
            echo "Recorded cedar-detect SHA"
          fi

          if [[ "${{ needs.sycamore-build.result }}" == "success" ]]; then
            if [[ "${{ inputs.component }}" == "sycamore-matched" ]]; then
              sha_of mconsidine/sycamore-extract matched-filter-only \
                > vendor/.shas/sycamore-matched
              echo "Recorded sycamore-matched SHA"
            else
              sha_of mconsidine/sycamore-extract "$SYCAMORE_REF" \
                > vendor/.shas/sycamore
              echo "Recorded sycamore SHA"
            fi
          fi

          if [[ "${{ needs.cedar-solve-build.result }}" == "success" ]]; then
            sha_of mconsidine/cedar-solve "$CEDARSOLVE_REF" > vendor/.shas/cedar-solve
            echo "Recorded cedar-solve SHA"
          fi

          if [[ "${{ needs.tetra3rs-build.result }}" == "success" ]]; then
            sha_of mconsidine/tetra3rs "$TETRA3RS_REF" > vendor/.shas/tetra3rs
            echo "Recorded tetra3rs SHA"
          fi

          if [[ "${{ needs.olive-solve-build.result }}" == "success" ]]; then
            sha_of mconsidine/olive-solve "$OLIVE_SOLVE_REF" > vendor/.shas/olive-solve
            echo "Recorded olive-solve SHA"
          fi

          if [[ "${{ needs.databases-build.result }}" == "success" ]]; then
            sha256sum scripts/generate_databases.py | cut -d' ' -f1 \
              > vendor/.shas/databases
            echo "Recorded databases hash"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vendor/.shas/
          if git diff --staged --quiet; then
            echo "No SHA changes to commit"
          else
            git commit -m "vendor: update source SHAs (manual build) [skip ci]"
            git push origin ${{ github.ref_name }}
          fi
