name: Build Databases

# Generates the star databases from the catalogs committed under data/
# and publishes them as assets on a tagged GitHub release.
#
# Standard databases (G ≤ 8.0):
#   cedar_solve_13deg.npz, tetra3rs_13deg.bin
#
# Deep databases (G ≤ 8.5, for poor-transparency nights):
#   cedar_solve_13deg_mag85.npz, tetra3rs_13deg_mag85.bin
#   Built only when data/gaia_hipp_merged_mag90.{bin,dat.gz} are present.
#   See README.md for how to generate the deeper source catalog.
#
# Triggers:
#   - push of a tag matching v*  → build + create release for that tag
#   - workflow_dispatch          → build + upload CI artifact only,
#                                  unless a tag name is supplied
#
# Consumers vendor the results with e.g.:
#   gh release download vX.Y --repo mconsidine/astro_databases --pattern '*.npz'

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to (blank = build only, no release)'
        required: false
        default: ''
      tetra3rs-ref:
        description: 'mconsidine/tetra3rs branch/tag/SHA to build with (blank = main, which tracks upstream)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install generators
        env:
          CEDARSOLVE_REF: ${{ vars.CEDARSOLVE_REF || 'master' }}
          TETRA3RS_REF: ${{ inputs.tetra3rs-ref || vars.TETRA3RS_REF || 'main' }}
        run: |
          pip install --upgrade pip uv
          # cedar-solve declares stale ceilings (Pillow<9, numpy caps, ...)
          # that predate Python 3.13. uv --override replaces just those
          # declared requirements while still resolving the rest of the
          # dependency tree, so new upstream deps are picked up automatically.
          printf 'pillow\nnumpy\nscipy\n' > /tmp/dep-overrides.txt
          uv pip install --system --override /tmp/dep-overrides.txt \
            "git+https://github.com/mconsidine/cedar-solve.git@${CEDARSOLVE_REF}"
          # tetra3rs is built from the fork so the database matches deployed
          # code; the fork's main tracks upstream, so the default is
          # equivalent to a PyPI install. Compiles the Rust extension
          # (~a few minutes on the hosted runner's preinstalled toolchain).
          SHA=$(git ls-remote "https://github.com/mconsidine/tetra3rs.git" \
            "refs/heads/${TETRA3RS_REF}" "refs/tags/${TETRA3RS_REF}" | head -1 | cut -f1)
          echo "tetra3rs ref: ${TETRA3RS_REF} (${SHA:-$TETRA3RS_REF})"
          pip install "git+https://github.com/mconsidine/tetra3rs.git@${TETRA3RS_REF}"
          pip show cedar-solve tetra3rs | grep -E '^(Name|Version):'

      - name: Generate databases
        run: |
          # --all-variants builds standard (G ≤ 8.0) unconditionally and the
          # deep variant (G ≤ 8.5) only when the deeper source catalog is
          # present in data/. Missing deep catalog → INFO log + skip, not error.
          python scripts/generate_databases.py --output-dir databases --all-variants
          ls -lh databases/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-databases
          path: |
            databases/cedar_solve_13deg.npz
            databases/tetra3rs_13deg.bin
            databases/cedar_solve_13deg_mag85.npz
            databases/tetra3rs_13deg_mag85.bin
            databases/manifest.json
          retention-days: 14
          # Standard files are always produced; deep files may be absent when
          # the deeper source catalog has not yet been committed.
          if-no-files-found: warn

      - name: Upload artifact (standard only, error if absent)
        uses: actions/upload-artifact@v4
        with:
          name: star-databases-standard
          path: |
            databases/cedar_solve_13deg.npz
            databases/tetra3rs_13deg.bin
            databases/manifest.json
          retention-days: 14
          if-no-files-found: error

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: ${{ steps.tag.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "Star databases generated from \`data/\` catalogs at ${GITHUB_SHA}."
            echo
            echo '```json'
            cat databases/manifest.json
            echo '```'
          } > release-notes.md

          # Always attach standard databases.
          ASSETS=(
            databases/cedar_solve_13deg.npz
            databases/tetra3rs_13deg.bin
            databases/manifest.json
          )

          # Attach deep databases only when they were built.
          for f in databases/cedar_solve_13deg_mag85.npz databases/tetra3rs_13deg_mag85.bin; do
            [[ -f "$f" ]] && ASSETS+=("$f")
          done

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
              "${ASSETS[@]}"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Star databases $TAG" \
              --notes-file release-notes.md \
              "${ASSETS[@]}"
          fi
