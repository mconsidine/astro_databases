name: mirror-base-image

# Archive a Raspberry Pi OS base image here as a release asset so diofinder's
# pinned build survives upstream pruning of the dated snapshot (Raspberry Pi
# removes old /images/ snapshots over time, which would 404 the pinned URL and
# break reproducible rebuilds). Dispatch-only.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base image .img.xz URL to mirror"
        required: true
        default: "https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2026-09-15/2026-09-15-raspios-trixie-arm64-lite.img.xz"
      sha256:
        description: "Expected SHA-256 (verified before publish; blank = skip)"
        required: false
        default: "cdf4f3bfac35ae947b46e4e767f935453810549779ac3290e05a6754aee627e5"
      tag:
        description: "Release tag to attach the mirrored image to"
        required: true
        default: "base-image-2026-09-15"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: download + verify
        run: |
          fn="$(basename "${{ inputs.url }}")"
          echo "Downloading $fn from ${{ inputs.url }}"
          curl -fsSL --retry 3 -o "$fn" "${{ inputs.url }}"
          ls -lh "$fn"
          got=$(sha256sum "$fn" | cut -d' ' -f1)
          echo "measured SHA-256: $got"
          if [ -n "${{ inputs.sha256 }}" ]; then
            if [ "$got" != "${{ inputs.sha256 }}" ]; then
              echo "::error::SHA-256 mismatch (expected ${{ inputs.sha256 }}, got $got)"
              exit 1
            fi
            echo "SHA-256 verified against the pin"
          fi
          echo "$got  $fn" > "$fn.sha256"

      - name: publish release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            *.img.xz
            *.img.xz.sha256
          body: |
            Mirror of a Raspberry Pi OS Lite base image, archived for diofinder's
            supply-chain pinning so reproducible rebuilds survive upstream
            pruning of the dated snapshot.

            Source: ${{ inputs.url }}
            SHA-256: ${{ inputs.sha256 }}
          draft: false
          prerelease: false
